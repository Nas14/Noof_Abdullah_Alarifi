<!DOCTYPE html>
<html lang="en">
<head>
    
    <title> Table Row Span </title>
    <style>
        table, th, td {
            border: 1px solid blue;
          /*border-collapse: collapse;*/
        }
    </style>

</head>
<body>
    <table>
        <tr>
           
            <th> ID </th>
            <th> Name </th>
            <th> Age </th>
            <th> Mobile </th>
        </tr>
        <tr>
            <td  rowspan="3"> 1 </td>
            <td>Mohammad</td>
            <td>19</td>
            <td>0506595231</td>
        </tr>
        <tr>
            <td> Ali </td>
            <td>20</td>
            <td>0506597775</td>
            
        </tr>
        <tr>
            <td> Khalid </td>
            <td>25</td>
            <td>0506597775</td>
            
        </tr>
        <tr>
            <td> 4 </td>
            <td> Ahmed </td>
            <td>22</td>
            <td>0506597775</td>
            
        </tr>
    </table>
</body>
</html>
