<!DOCTYPE html>
<html lang="en">
<head>
    
    <title> Table Column Span </title>
    <style>
        table, th, td {
            border: 1px solid blue;
          /*  border-collapse: collapse;*/
        }
    </style>

</head>
<body>
    <table>
        <tr>
           
            <th colspan="3"> Name </th>
            <th> age </th>
        </tr>
        <tr>
            <td> 11 </td>
            <td>Mohammad</td>
            <td>19</td>
            <td>19</td>
        </tr>
        <tr>
            <td> 22 </td>
            <td>Ali</td>
            <td>20</td>
            <td>19</td>
        </tr>
    </table>
</body>
</html>
